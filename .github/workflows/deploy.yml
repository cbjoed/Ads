name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install dependencies
      run: dotnet restore

    - name: Build Blazor WebAssembly
      run: dotnet build -c Release --no-restore

    - name: Publish Blazor App
      run: dotnet publish -c Release -o ./publish/app

    - name: Prepare GitHub Pages output
      run: |
        mkdir -p ./publish/pages
        cp -r ./publish/app/wwwroot/* ./publish/pages/
        echo "Contents of publish/pages:"
        ls -la ./publish/pages/

    - name: Add .nojekyll file
      run: touch ./publish/pages/.nojekyll

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './publish/pages'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

