<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Page Not Found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .error-container {
            text-align: center;
            color: white;
        }

        .error-code {
            font-size: 4rem;
            font-weight: bold;
            margin: 0;
        }

        .error-message {
            font-size: 1.5rem;
            margin: 0.5rem 0 2rem 0;
        }

        .error-description {
            font-size: 1rem;
            margin: 1rem 0 2rem 0;
            opacity: 0.9;
        }

        .error-link {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.75rem 2rem;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .error-link:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <p class="error-code">404</p>
        <p class="error-message">Not Found</p>
        <p class="error-description">The page you're looking for doesn't exist.</p>
        <a href="/" class="error-link">Back to Home</a>
    </div>

    <script>
        // Redirect to index.html for client-side routing
        if (location.pathname !== '/' && !location.pathname.match(/\.(html|js|css|png|jpg|gif|svg|woff|woff2|ttf|eot)$/)) {
            history.replaceState(null, '', '/');
            location.href = '/';
        }
    </script>
</body>
</html>
