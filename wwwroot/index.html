<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ads - Study Timer & Task Manager</title>
    <base href="/" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="AdsApp.styles.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- For ad network integration -->
    <meta name="description" content="A beautiful Pomodoro study timer with task management and ambient sounds." />
    <meta property="og:title" content="Ads - Study Timer & Task Manager" />
    <meta property="og:description" content="Boost your productivity with our Pomodoro timer, task management, and ambient sounds." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ads.cbjoed.com/" />
</head>
<body>
    <div id="app">
        <div class="spinner-container">
            <svg class="spinner" viewBox="0 0 50 50">
                <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
            </svg>
            <p>Loading your study timer...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        <environment include="Staging,Production">
            An error has occurred. This application may no longer respond until reloaded.
        </environment>
        <environment include="Development">
            An unhandled exception has occurred. See browser dev tools for details.
        </environment>
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/site.js"></script>
</body>
</html>
